version: '3'

rpc:
  listen: tcp://127.0.0.1:6005

server:
  command: "php php_test_files/http/client.php echo pipes"
  relay: "pipes"
  relay_timeout: "20s"

status:
  address: "127.0.0.1:34333"

logs:
  mode: development
  level: debug

http:
  address: 127.0.0.1:11933
  max_request_size: 1024
  uploads:
    forbid: [ ".php", ".exe", ".bat" ]
  pool:
    num_workers: 2
    allocate_timeout: 60s
    destroy_timeout: 60s
